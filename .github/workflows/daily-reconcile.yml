# Daily reconciliation. Generates proposals only; never writes to the CRM.
# The ledger (SQLite) is persisted between runs as an artifact so decisions are remembered.
name: daily-reconcile
on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC daily
  workflow_dispatch: {}
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Restore ledger
        uses: dawidd6/action-download-artifact@v6
        with: { name: ledger, path: data, if_no_artifact_found: warn }
      - run: python -m pytest -q
      - run: python scripts/run_daily.py
        env:
          CRM_TOKEN: ${{ secrets.CRM_TOKEN }}
      - uses: actions/upload-artifact@v4
        with: { name: ledger, path: data/ledger.db }
